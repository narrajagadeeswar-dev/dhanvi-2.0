<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── CONSTANTS ──────────────────────────────────────────────────────────── */
const BLOOD_GROUPS = ["A+","A−","B+","B−","AB+","AB−","O+","O−","Unknown"];
const RELATIONS    = ["Mother","Father","Spouse","Sibling","Guardian","Other"];
const GENDERS      = ["Male","Female","Other","Prefer not to say"];

/* ─── DHANVI AI VOICE ENGINE (Web Speech API) ────────────────────────────── */
const DhanviVoice = {
  isSupported: typeof window !== "undefined" && ("speechSynthesis" in window || "webkitSpeechRecognition" in window || "SpeechRecognition" in window),
  speaking: false,
  listening: false,
  recognition: null,

  speak(text, onStart, onEnd, lang = "te-IN") {
    if (typeof window === "undefined" || !("speechSynthesis" in window)) return false;
    window.speechSynthesis.cancel();

    const cleanText = text
      .replace(/\*\*(.*?)\*\*/g, "$1")
      .replace(/\*(.*?)\*/g, "$1")
      .replace(/#{1,6}\s?/g, "")
      .replace(/\[(.*?)\]\(.*?\)/g, "$1")
      .replace(/[•▸\-\*▸]\s/g, "")
      .replace(/`/g, "")
      .replace(/[🚨⚡🤖🏥💊🩸✓💡⚠️👨‍⚕️🧪]/g, "")
      .trim();

    if (!cleanText) return false;

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.rate = 0.92;
    utterance.pitch = 1.0;

    const hasTelugu = /[\u0c00-\u0c7f]/.test(cleanText) || (lang && lang.startsWith("te"));
    const targetLang = hasTelugu ? "te-IN" : lang;
    utterance.lang = targetLang;

    const voices = window.speechSynthesis.getVoices();
    let preferredVoice = null;
    if (hasTelugu) {
      preferredVoice = voices.find(v => 
        (v.lang && (v.lang.toLowerCase().startsWith("te") || v.lang.toLowerCase().replace('_', '-').includes("te-in") || v.lang.toLowerCase().includes("telugu"))) ||
        (v.name && v.name.toLowerCase().includes("telugu"))
      );
    } else {
      preferredVoice = voices.find(v => v.lang.includes("en-IN") || v.name.includes("India")) ||
                       voices.find(v => v.lang.includes("en-GB") || v.name.includes("Natural") || v.name.includes("Google")) ||
                       voices.find(v => v.lang.startsWith("en"));
    }
    if (preferredVoice) utterance.voice = preferredVoice;

    utterance.onstart = () => {
      this.speaking = true;
      if (onStart) onStart();
    };
    utterance.onend = () => {
      this.speaking = false;
      if (onEnd) onEnd();
    };
    utterance.onerror = () => {
      this.speaking = false;
      if (onEnd) onEnd();
    };

    window.speechSynthesis.speak(utterance);
    return true;
  },

  stop() {
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    this.speaking = false;
  },

  startListening(onResult, onEnd, onError, lang = "te-IN") {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      if (onError) onError("Microphone voice recognition not supported in this browser.");
      return null;
    }
    this.stop();
    try {
      const rec = new SpeechRec();
      rec.lang = lang;
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      rec.onstart = () => { this.listening = true; };
      rec.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join("");
        const isFinal = e.results[0].isFinal;
        if (onResult) onResult(transcript, isFinal);
      };
      rec.onerror = (err) => {
        this.listening = false;
        if (onError) onError(err.error || "Microphone error");
      };
      rec.onend = () => {
        this.listening = false;
        if (onEnd) onEnd();
      };

      rec.start();
      this.recognition = rec;
      return rec;
    } catch(err) {
      if (onError) onError(err.message);
      return null;
    }
  },

  stopListening() {
    if (this.recognition) {
      try { this.recognition.stop(); } catch(e){}
    }
    this.listening = false;
  }
};

/* ─── SERVER & SECURITY API CLIENT ───────────────────────────────────────── */
const DhanviAPI = {
  baseUrl: (window.location.origin && window.location.origin.startsWith("http")) ? window.location.origin : "http://127.0.0.1:8080",
  token: localStorage.getItem("dhanvi_jwt_token") || null,
  isServerLive: false,

  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem("dhanvi_jwt_token", t);
    else localStorage.removeItem("dhanvi_jwt_token");
  },

  async ping() {
    try {
      const res = await fetch(`${this.baseUrl}/api/health`, { method: "GET", headers: { "Accept": "application/json" } });
      const data = await res.json();
      this.isServerLive = res.ok && data.status === "HEALTHY";
      return this.isServerLive;
    } catch {
      this.isServerLive = false;
      return false;
    }
  },

  async request(endpoint, options = {}) {
    const url = `${this.baseUrl}${endpoint}`;
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (this.token) headers["Authorization"] = `Bearer ${this.token}`;
    try {
      const res = await fetch(url, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    } catch (err) {
      return { ok: false, status: 0, error: err.message, fallback: true };
    }
  },

  async sendOTP(phone) {
    return this.request("/api/auth/send-otp", { method: "POST", body: JSON.stringify({ phone }) });
  },

  async verifyOTP(phone, otp) {
    return this.request("/api/auth/verify-otp", { method: "POST", body: JSON.stringify({ phone, otp }) });
  },

  async registerPatient(payload) {
    const res = await this.request("/api/auth/register-patient", { method: "POST", body: JSON.stringify(payload) });
    if (res.ok && res.data && res.data.token) this.setToken(res.data.token);
    return res;
  },

  async login(payload) {
    const res = await this.request("/api/auth/login", { method: "POST", body: JSON.stringify(payload) });
    if (res.ok && res.data && res.data.token) this.setToken(res.data.token);
    return res;
  },

  async bookOPD(payload) {
    return this.request("/api/patient/book-opd", { method: "POST", body: JSON.stringify(payload) });
  },

  async unlockVault(otp) {

  async deleteDoctor(id) {

  async fetchAdminHospitals() {

  },

  async editHospital(payload) {

  },

  async deleteHospital(id) {
    return this.request("/api/admin/hospital/delete", { method: "POST", body: JSON.stringify({ id }) });
  },

  async addClinicalNote(payload) {

  },

  async updateDoctorSchedule(payload) {
    return this.request("/api/doctor/schedule", { method: "POST", body: JSON.stringify(payload) });

  async callAIChat(message, history = [], patient_id = "9876543210") {

function GoogleHospitalMap({ hospitals = QUICK_HOSPITALS, selectedHospital, onSelectHospital, height = "260px", showRoute = false, activeAmbulance = false }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const routeLineRef = useRef(null);
  const [mapReady, setMapReady] = useState(false);
  const [mapFailed, setMapFailed] = useState(false);
  const [activeType, setActiveType] = useState("roadmap");
  const userCoords = { lat: 12.9352, lng: 77.6245 };

  useEffect(() => {
    function onFail() { setMapFailed(true); }
    window.addEventListener("dhanvi_gm_fail", onFail);
    return () => window.removeEventListener("dhanvi_gm_fail", onFail);
  }, []);

  useEffect(() => {
    if (window.__dhanvi_gm_error) {
      setMapFailed(true);
      return;
    }

    if (!window.google || !window.google.maps || !window.google.maps.Map) {
      const timer = setTimeout(() => {
        if (!window.google || !window.google.maps || !window.google.maps.Map) {
          setMapFailed(true);
        }
      }, 2500);
      return () => clearTimeout(timer);
    }

    try {
      if (!mapRef.current) return;
      const isClassic = document.body.classList.contains("theme-classic");
      const map = new window.google.maps.Map(mapRef.current, {
        center: { lat: 12.9380, lng: 77.6150 },
        zoom: 13,
        styles: isClassic ? null : DHANVI_MAP_STYLES,
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });

      mapInstanceRef.current = map;

      new window.google.maps.Marker({
        position: userCoords,
        map: map,
        title: "Your Location (DHANVI GPS)",
        icon: {
          path: window.google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: "#0284c7",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2,
        }
      });

      markersRef.current.forEach(m => m.marker.setMap(null));
      markersRef.current = [];

      const created = hospitals.map(h => {
        const marker = new window.google.maps.Marker({
          position: { lat: h.lat || 12.9345, lng: h.lng || 77.6101 },
          map: map,
          title: h.name,
          icon: {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
            fillColor: h.color || "#0284c7",
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 1.5,
            scale: 1.4,
            anchor: new window.google.maps.Point(12, 22),
          }
        });

        const info = new window.google.maps.InfoWindow({
          content: '<div style="background:' + (isClassic ? '#ffffff' : '#0f172a') + ';color:' + (isClassic ? '#0f172a' : '#f8fafc') + ';padding:10px 14px;border-radius:12px;font-family:sans-serif;min-width:160px;border:1px solid ' + (isClassic ? '#0284c7' : '#14b8a6') + ';box-shadow:0 4px 16px rgba(0,0,0,0.12);">' +
            '<div style="font-weight:bold;font-size:14px;color:' + (isClassic ? '#0f172a' : '#fff') + ';">' + h.name + '</div>' +
            '<div style="font-size:11px;color:' + (isClassic ? '#64748b' : '#94a3b8') + ';margin-top:2px;">' + (h.dist || "Nearby") + ' · ★ ' + (h.rating || "4.8") + '</div>' +
            '<div style="margin-top:6px;display:flex;gap:4px;align-items:center;">' +
              '<span style="background:' + (isClassic ? '#e0f2fe' : 'rgba(20,184,166,0.2)') + ';color:' + (isClassic ? '#0369a1' : '#2dd4bf') + ';padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold;">🛏️ ' + (h.beds || 10) + ' Beds</span>' +
              (h.er ? '<span style="background:' + (isClassic ? '#fee2e2' : 'rgba(239,68,68,0.2)') + ';color:' + (isClassic ? '#dc2626' : '#f87171') + ';padding:2px 6px;border-radius:4px;font-size:9px;font-weight:bold;">24/7 ER</span>' : '') +
            '</div>' +
          '</div>'
        });

        marker.addListener("click", () => {
          info.open(map, marker);
          if (onSelectHospital) onSelectHospital(h);
        });

        return { id: h.id, name: h.name, marker, info, data: h };
      });

      markersRef.current = created;
      setMapReady(true);
    } catch (e) {
      console.warn("Maps init error:", e);
      setMapFailed(true);
    }
  }, [hospitals]);

  useEffect(() => {
    if (!mapInstanceRef.current || !selectedHospital) return;
    const found = markersRef.current.find(m => (m.id && m.id === selectedHospital.id) || m.name === selectedHospital.name);
    if (found) {
      mapInstanceRef.current.panTo({ lat: found.data.lat, lng: found.data.lng });
      found.info.open(mapInstanceRef.current, found.marker);

      if (showRoute || activeAmbulance) {

  function panToUser() {
    if (mapInstanceRef.current) {
      mapInstanceRef.current.panTo(userCoords);
      mapInstanceRef.current.setZoom(14);
    }
  }

  function toggleMapType(type) {
    if (mapInstanceRef.current) {
      mapInstanceRef.current.setMapTypeId(type);
      setActiveType(type);
    }
  }

  return (
    <div className="relative rounded-2xl border border-slate-800 overflow-hidden bg-[#020817] shadow-xl" style={{ height }}>
      <div ref={mapRef} className="w-full h-full" style={{ display: mapFailed ? "none" : "block" }}></div>

      {mapFailed && (
        <div className="absolute inset-0 map-grid flex flex-col justify-between p-3">
          <div className="flex items-center justify-between z-10">
            <span className="text-[10px] mono text-teal-400 bg-slate-900/90 px-2 py-0.5 rounded border border-teal-500/30">
              🛰️ DHANVI GPS RADAR
            </span>
            <span className="text-[10px] mono text-slate-400 bg-slate-900/90 px-2 py-0.5 rounded border border-slate-800">
              12.9352° N, 77.6245° E
            </span>
          </div>

          <div className="relative flex-1 my-2">
            {hospitals.map((h, i) => {
              const offsets = [
                { top: "22%", left: "18%" },
                { top: "60%", left: "68%" },
                { top: "18%", left: "75%" },
                { top: "72%", left: "32%" },
                { top: "35%", left: "84%" },
                { top: "78%", left: "72%" },
                { top: "42%", left: "12%" },
                { top: "82%", left: "18%" },
                { top: "14%", left: "46%" },
                { top: "54%", left: "28%" },
                { top: "28%", left: "58%" },
                { top: "68%", left: "50%" }
              ][i % 12];
              const isSel = selectedHospital && ((selectedHospital.id && selectedHospital.id === h.id) || selectedHospital.name === h.name);
              return (
                <div key={i} onClick={() => onSelectHospital && onSelectHospital(h)}
                  className="absolute cursor-pointer transition transform hover:scale-125"
                  style={{ top: offsets.top, left: offsets.left }}>
                  <div className={"w-4 h-4 rounded-full border-2 border-white shadow-lg " + (isSel ? "ring-4 ring-teal-400 scale-125" : "")}
                    style={{ background: h.color || "#14b8a6" }}></div>
                  <span className="absolute -top-5 left-1/2 -translate-x-1/2 text-[9px] font-bold whitespace-nowrap bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800"
                    style={{ color: h.color || "#14b8a6" }}>
                    {h.name.split(" ")[0]} ({h.beds || 10}B)
                  </span>
                </div>
              );
            })}

            <div className="absolute" style={{ top: "48%", left: "45%" }}>
              <div className="w-4 h-4 rounded-full bg-white border-2 border-teal-400 shadow-xl"></div>
              <div className="absolute inset-0 w-4 h-4 rounded-full bg-teal-400/50 animate-ping"></div>
              <span className="absolute -top-4 left-1/2 -translate-x-1/2 text-[8px] font-black text-white whitespace-nowrap bg-slate-950/80 px-1 rounded">YOU</span>
            </div>
          </div>
        </div>
      )}

      <div className="absolute top-2.5 left-2.5 z-10 flex items-center gap-1.5">
        <span className="text-[9px] mono font-bold text-slate-300 bg-slate-950/85 border border-teal-500/30 px-2 py-0.5 rounded backdrop-blur-md flex items-center gap-1">
          <span className="w-1.5 h-1.5 rounded-full bg-teal-400 animate-ping inline-block"></span>

        <button onClick={panToUser} className="text-[9px] mono font-bold text-slate-300 bg-slate-900/85 hover:bg-teal-500/20 hover:text-white border border-slate-700 px-2 py-0.5 rounded backdrop-blur-md transition">
          🎯 GPS

      <div className="absolute top-2.5 right-2.5 z-10 flex items-center gap-1 bg-slate-950/85 p-0.5 rounded border border-slate-800 backdrop-blur-md">
        <button onClick={() => toggleMapType("roadmap")}

  );
}

/* ─── OTP BOXES ─────────────────────────────────────────────────────────── */
function OTPInput({length=6, onComplete, disabled}){
  const [vals, setVals] = useState(Array(length).fill(""));
  const refs = Array.from({length}, ()=>useRef(null));

  function handleKey(i, e){
    if(e.key==="Backspace"){
      if(!vals[i] && i>0){ refs[i-1].current.focus(); }
      const nv=[...vals]; nv[i]=""; setVals(nv);
      return;
    }
    const ch = e.key.replace(/[^0-9]/g,"");
    if(!ch) return;
    const nv=[...vals]; nv[i]=ch; setVals(nv);
    if(i<length-1) refs[i+1].current.focus();
    if(nv.every(v=>v)) onComplete && onComplete(nv.join(""));
  }

  function handlePaste(e){
    const txt = e.clipboardData.getData("text").replace(/\D/g,"").slice(0,length);
    const nv = Array(length).fill("").map((_,i)=>txt[i]||"");
    setVals(nv);
    if(txt.length===length){ onComplete && onComplete(nv.join("")); refs[length-1].current.focus(); }
    else refs[Math.min(txt.length,length-1)].current.focus();
  }

  return (
    <div className="flex gap-2.5 justify-center">
      {vals.map((v,i)=>(
        <input key={i} ref={refs[i]} type="text" inputMode="numeric" maxLength={1}
          value={v} disabled={disabled}
          className={`otp-box ${v?'filled':''}`}
          onKeyDown={e=>handleKey(i,e)}
          onPaste={handlePaste}
          onChange={()=>{}}/>
      ))}
    </div>
  )
}

/* ─── OTP COUNTDOWN TIMER ───────────────────────────────────────────────── */
function OTPTimer({seconds, onExpire}){
  const [left, setLeft] = useState(seconds);
  useEffect(()=>{
    if(left<=0){ onExpire&&onExpire(); return; }
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return ()=>clearTimeout(t);
  },[left]);
  const pct = left/seconds;
  const r=18; const circ=2*Math.PI*r;
  return (
    <div className="flex items-center gap-2 justify-center">
      <svg width="44" height="44" className="-rotate-90">
        <circle cx="22" cy="22" r={r} fill="none" stroke="rgba(51,65,85,0.6)" strokeWidth="3"/>
        <circle cx="22" cy="22" r={r} fill="none" stroke={left>10?"#14b8a6":"#f43f5e"} strokeWidth="3"
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear"}}/>
      </svg>
      <span className={`mono text-sm font-bold ${left>10?"text-teal-400":"text-rose-400"}`}>
        {String(Math.floor(left/60)).padStart(2,"0")}:{String(left%60).padStart(2,"0")}
      </span>
    </div>
  )
}

/* ─── PHOTO UPLOAD ───────────────────────────────────────────────────────── */
function PhotoUpload({value, onChange}){
  const fileRef = useRef(null);
  function handleFile(e){
    const f = e.target.files[0];
    if(!f) return;
    if(f.size > 5*1024*1024){ alert("Photo must be under 5 MB"); return; }
    const reader = new FileReader();
    reader.onload = ev => onChange(ev.target.result);
    reader.readAsDataURL(f);
  }
  return (
    <div className="flex flex-col items-center gap-3">
      <div className="photo-zone" onClick={()=>fileRef.current.click()}>
        {value
          ? <img src={value} alt="Profile"/>
          : <>
              <span className="text-3xl">📷</span>
              <span className="text-[10px] text-slate-500 mt-1 text-center px-2">Tap to upload</span>
            </>
        }
      </div>
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
      {value
        ? <button type="button" onClick={()=>onChange(null)} className="text-xs text-rose-400 hover:text-rose-300 underline">Remove photo</button>
        : <p className="text-[10px] text-slate-500 text-center">JPG / PNG · Max 5 MB<br/>Your profile photo</p>
      }
    </div>
  )
}

          <div className="flex flex-col items-center gap-1">

        </React.Fragment>
      ))}
    </div>
  )
}

/* ═══════════════════════════════════════════════════════════════════════════
   PATIENT — PHONE + OTP STEP
═══════════════════════════════════════════════════════════════════════════ */
function PhoneOTPStep({onVerified}){
  const [phone, setPhone]       = useState("");
  const [sent, setSent]         = useState(false);
  const [otp, setOtp]           = useState("");
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState("");
  const [verified, setVerified] = useState(false);
  const DEMO_OTP = "123456";

  async function sendOTP(){
    if(!/^[6-9]\d{9}$/.test(phone.replace(/\s/g,""))){ setError("Enter a valid 10-digit Indian mobile number"); return; }
    setError(""); setLoading(true);
    try {
      const res = await DhanviAPI.sendOTP(phone);
      if(!res.ok && !res.fallback){
        setError(res.data?.error || "Failed to send OTP.");
        setLoading(false);
        return;
      }
    } catch(e){}
    setSent(true); setLoading(false);
  }

  async function verifyOTP(code){
    setLoading(true);
    try {
      const res = await DhanviAPI.verifyOTP(phone, code);
      if(res.ok || code === DEMO_OTP){
        setVerified(true);
        setTimeout(()=>onVerified(phone), 800);
        return;
      }
      setError(res.data?.error || "Incorrect OTP. Demo OTP: 123456");
      setLoading(false);
    } catch(e){
      if(code === DEMO_OTP){
        setVerified(true);
        setTimeout(()=>onVerified(phone), 800);
      } else {
        setError("Incorrect OTP. Demo OTP: 123456");
        setLoading(false);
      }
    }
  }

  if(verified){
    return (
      <div className="text-center py-8 space-y-4 fade-up">
        <svg width="64" height="64" viewBox="0 0 64 64" className="mx-auto">
          <circle cx="32" cy="32" r="30" fill="rgba(20,184,166,0.15)" stroke="#14b8a6" strokeWidth="2"/>
          <polyline points="18,34 28,44 46,22" fill="none" stroke="#14b8a6" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="check-circle"/>
        </svg>
        <p className="text-emerald-400 font-black text-lg">Phone Verified! ✓</p>
        <p className="text-slate-400 text-sm">Setting up your profile…</p>
      </div>
    )
  }

  return (
    <div className="space-y-6 fade-up">
      <div>
        <h3 className="text-xl font-black text-white mb-1">Verify your phone</h3>
        <p className="text-slate-400 text-sm">We'll send a 6-digit OTP to your number</p>
      </div>

      {!sent ? (
        <div className="space-y-4">
          <div>
            <Label required>Mobile Number</Label>
            <div className="flex gap-2">
              <div className="flex items-center px-3 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-sm font-mono shrink-0">🇮🇳 +91</div>
              <input className={`inp flex-1 ${error?'inp-error':''}`} type="tel" placeholder="98765 43210" maxLength={10}
                value={phone} onChange={e=>{ setPhone(e.target.value.replace(/\D/g,"")); setError(""); }}/>
            </div>
            <ErrMsg msg={error}/>
          </div>
          <button className="btn-teal w-full py-3 text-sm" disabled={loading||phone.length<10} onClick={sendOTP}>
            {loading ? <span className="flex items-center justify-center gap-2"><span className="w-4 h-4 border-2 border-slate-900/40 border-t-slate-900 rounded-full spin inline-block"></span>Sending OTP…</span> : "📱 Send OTP"}
          </button>
          <p className="text-center text-xs text-slate-600">Demo: any 10-digit number starting with 6-9</p>
        </div>
      ) : (
        <div className="space-y-6">
          <div className="text-center">
            <p className="text-slate-300 text-sm mb-1">OTP sent to <span className="text-teal-400 font-bold">+91 {phone}</span></p>
            <button onClick={()=>{setSent(false);setError("");}} className="text-xs text-slate-500 underline">Change number</button>
          </div>
          <div>
            <Label>Enter 6-Digit OTP</Label>
            <OTPInput length={6} onComplete={verifyOTP} disabled={loading}/>
            <ErrMsg msg={error}/>
          </div>
          <OTPTimer seconds={120} onExpire={()=>setSent(false)}/>
          {loading && <p className="text-center text-teal-400 text-sm mono">Verifying…</p>}
          <div className="text-center">
            <p className="text-xs text-slate-600 mb-1">Didn't receive it?</p>
            <button onClick={sendOTP} className="text-xs text-teal-400 underline font-semibold">Resend OTP</button>
          </div>
          <p className="text-center text-xs text-slate-600 bg-slate-900/50 rounded-xl py-2 mono">Demo OTP: <span className="text-teal-400 font-bold">123456</span></p>
        </div>
      )}
    </div>
  )
}

/* ═══════════════════════════════════════════════════════════════════════════
   PATIENT — PASSWORD STEP
═══════════════════════════════════════════════════════════════════════════ */
function PasswordStep({data, onChange, errors}){
  const [show, setShow] = useState({pw:false,cpw:false});

  function strength(p){
    let s=0;
    if(p.length>=8)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
    return s;
  }
  const s = strength(data.password||"");
  const bars = ["bg-rose-500","bg-amber-400","bg-yellow-300","bg-emerald-400"];
  const labels = ["Weak","Fair","Good","Strong"];

  return (
    <div className="space-y-5 fade-up">
      <div>
        <h3 className="text-xl font-black text-white mb-1">Create Password</h3>
        <p className="text-slate-400 text-sm">Secure your DHANVI health account</p>
      </div>

      <div>
        <Label required>Password</Label>
        <div className="relative">
          <input className={`inp pr-10 ${errors.password?'inp-error':''}`}
            type={show.pw?"text":"password"} placeholder="Min 8 characters"
            value={data.password||""} onChange={e=>onChange("password",e.target.value)}/>
          <button type="button" onClick={()=>setShow(s=>({...s,pw:!s.pw}))}
            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm">
            {show.pw?"🙈":"👁️"}
          </button>
        </div>
        <ErrMsg msg={errors.password}/>
        {data.password && (
          <div className="mt-2 space-y-1.5">
            <div className="flex gap-1">
              {[0,1,2,3].map(i=>(
                <div key={i} className={`h-1.5 flex-1 rounded-full transition-all ${i<s?bars[s-1]:"bg-slate-800"}`}></div>
              ))}
            </div>
            <p className="text-xs" style={{color:s<2?"#f87171":s<3?"#fbbf24":"#34d399"}}>{labels[s-1]||"Too short"}</p>
          </div>
        )}
      </div>

      <div>
        <Label required>Confirm Password</Label>
        <div className="relative">
          <input className={`inp pr-10 ${errors.confirmPassword?'inp-error':''}`}
            type={show.cpw?"text":"password"} placeholder="Re-enter your password"
            value={data.confirmPassword||""} onChange={e=>onChange("confirmPassword",e.target.value)}/>
          <button type="button" onClick={()=>setShow(s=>({...s,cpw:!s.cpw}))}
            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm">
            {show.cpw?"🙈":"👁️"}
          </button>
        </div>
        <ErrMsg msg={errors.confirmPassword}/>
        {data.confirmPassword && data.password===data.confirmPassword && (
          <p className="text-emerald-400 text-xs mt-1">✓ Passwords match</p>
        )}
      </div>

      <div className="bg-teal-950/30 border border-teal-500/20 rounded-xl p-4 space-y-2 text-xs text-slate-400">
        <p className="font-bold text-teal-400">Password requirements:</p>
        {[["At least 8 characters",data.password?.length>=8],["One uppercase letter",/[A-Z]/.test(data.password||"")],["One number",/[0-9]/.test(data.password||"")],["One special character",/[^A-Za-z0-9]/.test(data.password||"")]].map(([t,ok],i)=>(
          <p key={i} className={ok?"text-emerald-400":"text-slate-500"}>{ok?"✓":"◦"} {t}</p>
        ))}
      </div>

      {/* Terms */}
      <label className="flex gap-3 cursor-pointer">
        <input type="checkbox" checked={data.terms||false} onChange={e=>onChange("terms",e.target.checked)}
          className="w-4 h-4 mt-0.5 accent-teal-500 shrink-0"/>
        <span className="text-xs text-slate-400">
          I agree to the <span className="text-teal-400 underline cursor-pointer">Terms of Service</span> and <span className="text-teal-400 underline cursor-pointer">Privacy Policy</span>. My health data is encrypted and shared only with my consent.
        </span>
      </label>
      <ErrMsg msg={errors.terms}/>
    </div>
  )
}

      spec:"Dermatologist", icon:"🧴", urgency:"LOW",
      conditions:["Contact Dermatitis","Urticaria (Hives)","Eczema","Fungal Infection"],
      dos:["Keep area clean & dry","Apply prescribed cream","Avoid known allergens"],
      donts:["Don't scratch the rash","Don't use random creams","Don't ignore spreading redness"] },
    { keys:["eye","vision","blur","redness","watering","sight"],
      spec:"Ophthalmologist", icon:"👁️", urgency:"MEDIUM",
      conditions:["Conjunctivitis","Dry Eye Syndrome","Refractive Error","Corneal Abrasion"],
      dos:["Eye wash with clean water","Wear sunglasses","See doctor promptly"],
      donts:["Don't rub eyes","Don't share towels/pillows","Don't delay if sudden vision loss"] },
    { keys:["ear","hearing","tinnitus","ringing","pain in ear","block"],
      spec:"ENT Specialist", icon:"👂", urgency:"LOW",
      conditions:["Otitis Media","Tinnitus","Wax Block","Eustachian Tube Dysfunction"],
      dos:["Keep ear dry","Use prescribed ear drops","Avoid loud noise"],
      donts:["Don't insert objects in ear","Don't ignore sudden hearing loss","Don't swim in dirty water"] },
    { keys:["sugar","diabetes","glucose","thirst","frequent urination","insulin"],
      spec:"Endocrinologist", icon:"🩸", urgency:"MEDIUM",
      conditions:["Type 1 Diabetes","Type 2 Diabetes","Pre-Diabetes","Hypoglycemia"],
      dos:["Monitor blood sugar regularly","Carry sugar/glucose tablet","Eat at fixed times"],
      donts:["Don't skip meals","Don't stop insulin without guidance","Don't ignore dizziness/sweating"] },
    { keys:["joint","knee","arthritis","swelling","stiff","bone","fracture"],
      spec:"Orthopedician", icon:"🦴", urgency:"MEDIUM",
      conditions:["Osteoarthritis","Rheumatoid Arthritis","Gout","Fracture (rule out)"],
      dos:["RICE method (Rest, Ice, Compression, Elevation)","Gentle mobility exercises","X-ray if trauma"],
      donts:["Don't weight-bear on suspected fracture","Don't ignore joint locking","Don't apply heat in acute injury"] },
  ];

  function matchSymptom(text){
    const lower = text.toLowerCase();
    for(const entry of KB){
      if(entry.keys.some(k => lower.includes(k))) return entry;
    }
    return { spec:"General Physician", icon:"🩺", urgency:"LOW",
      conditions:["Viral infection","General systemic illness","Stress-related condition","Requires further evaluation"],
      dos:["Stay hydrated","Rest","Consult a doctor"],
      donts:["Don't self-medicate","Don't ignore persisting symptoms","Don't panic"] };
  }

  const FOLLOW_UPS = [
    s => `Got it — you're experiencing **${s}**.\n\nHow long have you had this symptom?`,
    () => `Where exactly does it hurt or feel uncomfortable? Tap a body area or describe it:`,
    () => `On a scale of 1–10, how severe is it right now?`,
  ];

  const BODY_PARTS = ["🧠 Head/Neck","❤️ Chest","🫃 Abdomen","🦴 Back","💪 Arms/Legs","👁️ Eyes","👂 Ears","🧴 Skin","🫁 Lungs"];

  function addMsg(from, text){ setMessages(m => [...m, {from, text, ts: new Date()}]); }

  function aiReply(text, delay=1200){
    setTyping(true);
    setTimeout(()=>{ setTyping(false); addMsg("ai", text); }, delay);
  }

  function scrollBottom(){ setTimeout(()=>{ chatRef.current?.scrollTo({top:9999,behavior:"smooth"}); }, 100); }

  function sendMessage(){
    if(!input.trim()) return;
    const txt = input.trim(); setInput("");
    addMsg("user", txt); scrollBottom();

    if(phase==="symptom"){
      setCollectedSymptom(txt);
      setPhase("followup1");
      aiReply(FOLLOW_UPS[0](txt));
    } else if(phase==="followup1"){
      setDuration(txt);
      setPhase("bodypart");
      aiReply(FOLLOW_UPS[1]());
    } else if(phase==="severity_text"){
      const num = parseInt(txt);
      if(!isNaN(num) && num >= 1 && num <= 10){ setSeverity(num); }
      runAnalysis();
    } else {
      aiReply("Thanks! Analysing your responses…");
      runAnalysis();
    }
    scrollBottom();
  }

  function selectBodyPart(bp){
    setBodyPart(bp); addMsg("user", bp); scrollBottom();
    setPhase("severity");
    aiReply("Understood — " + bp + ".\n\nOn a scale of **1–10**, how severe is the pain/discomfort right now?\n(Use the slider below or type a number)");
  }

  function runAnalysis(){
    setPhase("analyzing");
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const match = matchSymptom(collectedSymptom + " " + bodyPart);
      const urgencyScore = severity >= 8 ? "EMERGENCY" : severity >= 6 ? "HIGH" : severity >= 4 ? "MEDIUM" : "LOW";
      const finalUrgency = match.urgency === "HIGH" || urgencyScore === "EMERGENCY" ? urgencyScore : urgencyScore;
      setResult({...match, urgency: finalUrgency, severity, duration, bodyPart, symptom: collectedSymptom});
      setPhase("result");
      addMsg("ai", "✅ Analysis complete! Scroll down to see your full health assessment report.");
    }, 2500);
    scrollBottom();
  }

  function reset(){
    setMessages([{from:"ai", text:"👋 New session started! Describe your symptom or health concern:", ts: new Date()}]);
    setPhase("symptom"); setResult(null); setSeverity(5); setDuration(""); setBodyPart(""); setCollectedSymptom(""); setInput("");
  }

  const URGENCY_CONFIG = {
    EMERGENCY:{ color:"#ef4444", bg:"rgba(239,68,68,0.1)", border:"rgba(239,68,68,0.4)", label:"🚨 EMERGENCY", sub:"Go to ER immediately" },
    HIGH:     { color:"#f59e0b", bg:"rgba(245,158,11,0.1)", border:"rgba(245,158,11,0.4)", label:"⚠️ HIGH URGENCY", sub:"See doctor today" },
    MEDIUM:   { color:"#06b6d4", bg:"rgba(6,182,212,0.1)",  border:"rgba(6,182,212,0.4)",  label:"📋 MODERATE", sub:"Book within 2–3 days" },
    LOW:      { color:"#22c55e", bg:"rgba(34,197,94,0.1)",  border:"rgba(34,197,94,0.4)",  label:"✅ LOW RISK", sub:"Monitor & manage at home" },
  };

  return (
    <div className="space-y-5 fade-up">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-black text-white">🤖 AI Health Checker</h2>
          <p className="text-slate-400 text-xs mt-0.5">Describe symptoms · Get specialist guidance · Book OPD instantly</p>
        </div>
        <button onClick={reset} className="text-xs text-slate-400 hover:text-teal-400 border border-slate-700 hover:border-teal-500/40 px-3 py-1.5 rounded-xl transition">↺ New Check</button>
      </div>

      {/* Disclaimer */}
      <div className="flex items-start gap-2.5 p-3 rounded-xl text-[10px]"
        style={{background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.25)"}}>
        <span className="text-amber-400 shrink-0 text-sm">ℹ️</span>
        <p className="text-slate-400 leading-relaxed"><strong className="text-amber-300">AI Advisory Only.</strong> This tool provides preliminary health guidance based on symptoms. It is NOT a substitute for professional medical diagnosis. Always consult a certified doctor for treatment decisions.</p>
      </div>

      {/* Chat window */}
      <div ref={chatRef} className="rounded-2xl border border-slate-700/60 overflow-y-auto"
        style={{background:"rgba(2,8,23,0.7)",minHeight:"320px",maxHeight:"420px"}}>

        {/* Chat header */}
        <div className="sticky top-0 flex items-center gap-2.5 px-4 py-3 border-b border-slate-700/50"
          style={{background:"rgba(15,23,42,0.95)",backdropFilter:"blur(8px)"}}>
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-base"
            style={{background:"linear-gradient(135deg,rgba(20,184,166,0.2),rgba(99,102,241,0.2))",border:"1px solid rgba(20,184,166,0.4)"}}>🤖</div>
          <div>
            <p className="font-black text-white text-xs leading-none">DHANVI AI Health Assistant</p>
            <p className="text-teal-400 text-[9px] mono mt-0.5">Powered by DHANVI Clinical AI · WHO Guidelines</p>
          </div>
          <div className="ml-auto flex items-center gap-1">
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span className="text-[9px] text-emerald-400">Online</span>
          </div>
        </div>

        {/* Messages */}
        <div className="p-4 space-y-3">
          {messages.map((m,i)=>(
            <div key={i} className={`flex gap-2.5 ${m.from==="user"?"flex-row-reverse":""}`}>
              {m.from==="ai"
                ? <div className="w-7 h-7 rounded-full flex items-center justify-center text-sm shrink-0 mt-0.5"
                    style={{background:"linear-gradient(135deg,rgba(20,184,166,0.2),rgba(99,102,241,0.2))",border:"1px solid rgba(20,184,166,0.3)"}}>🤖</div>
                : <div className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5 border-2 border-teal-500 overflow-hidden"
                    style={{background:"rgba(20,184,166,0.1)"}}>
                    {data.photo ? <img src={data.photo} alt="" className="w-full h-full object-cover"/> : <span className="text-sm">👤</span>}
                  </div>
              }
              <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl text-xs leading-relaxed ${m.from==="ai"?"rounded-tl-none":"rounded-tr-none"}`}
                style={{background:m.from==="ai"?"rgba(15,23,42,0.8)":"rgba(20,184,166,0.12)",
                        border:m.from==="ai"?"1px solid rgba(51,65,85,0.6)":"1px solid rgba(20,184,166,0.3)",
                        color: m.from==="ai"?"#cbd5e1":"#f1f5f9"}}>
                {m.text.split("\n").map((l,j)=>(
                  <span key={j}>{l.replace(/\*\*(.*?)\*\*/g,(_,t)=>t)}{j<m.text.split("\n").length-1&&<br/>}</span>
                ))}
              </div>
            </div>
          ))}

          {/* Typing indicator */}
          {typing && (
            <div className="flex gap-2.5">
              <div className="w-7 h-7 rounded-full flex items-center justify-center text-sm shrink-0"
                style={{background:"linear-gradient(135deg,rgba(20,184,166,0.2),rgba(99,102,241,0.2))",border:"1px solid rgba(20,184,166,0.3)"}}>🤖</div>
              <div className="px-4 py-3 rounded-2xl rounded-tl-none flex gap-1.5 items-center"
                style={{background:"rgba(15,23,42,0.8)",border:"1px solid rgba(51,65,85,0.6)"}}>
                {[0,1,2].map(i=>(
                  <div key={i} className="w-2 h-2 rounded-full bg-teal-400"
                    style={{animation:`pulse-ring 1s ease-in-out ${i*0.2}s infinite`}}/>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Body Part Selector */}
      {phase==="bodypart" && !typing && (
        <div className="space-y-2 fade-up">
          <p className="text-xs font-bold text-slate-400">Tap the affected area:</p>
          <div className="grid grid-cols-3 gap-2">
            {BODY_PARTS.map((bp,i)=>(
              <button key={i} onClick={()=>selectBodyPart(bp)}
                className="py-2.5 px-2 rounded-xl border border-slate-700 hover:border-teal-500/50 text-xs text-slate-300 hover:text-white transition hover:bg-teal-500/5 font-medium text-center">
                {bp}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Severity Slider */}
      {phase==="severity" && !typing && (
        <div className="space-y-3 fade-up">
          <div className="flex justify-between items-center">
            <p className="text-xs font-bold text-slate-400">Severity: <span className="text-white font-black text-base">{severity}/10</span></p>
            <span className="text-xs px-2 py-0.5 rounded-full font-bold"
              style={{background:severity>=8?"rgba(239,68,68,0.15)":severity>=6?"rgba(245,158,11,0.15)":severity>=4?"rgba(6,182,212,0.15)":"rgba(34,197,94,0.15)",
                      color:severity>=8?"#f87171":severity>=6?"#fbbf24":severity>=4?"#22d3ee":"#4ade80"}}>
              {severity>=8?"Severe":severity>=6?"Moderate-High":severity>=4?"Moderate":"Mild"}
            </span>
          </div>
          <input type="range" min="1" max="10" value={severity} onChange={e=>setSeverity(Number(e.target.value))}
            className="w-full h-2 rounded-full appearance-none cursor-pointer"
            style={{accentColor:"#14b8a6",background:`linear-gradient(to right, #14b8a6 ${(severity-1)/9*100}%, rgba(51,65,85,0.5) ${(severity-1)/9*100}%)`}}/>
          <div className="flex justify-between text-[9px] text-slate-600">
            <span>1 — No pain</span><span>5 — Bearable</span><span>10 — Unbearable</span>
          </div>
          <button onClick={()=>{ addMsg("user","Severity: "+severity+"/10"); runAnalysis(); }}
            className="btn-teal w-full py-2.5 text-sm">
            🔍 Analyse My Symptoms →
          </button>
        </div>
      )}

      {/* Text input (shown in symptom/followup phases) */}
      {(phase==="symptom"||phase==="followup1") && !typing && (
        <div className="flex gap-2">
          <input className="inp flex-1 text-sm" placeholder={phase==="symptom"?"e.g. chest pain, headache, fever…":"How long? e.g. 2 days, since morning…"}
            value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&sendMessage()}/>
          <button onClick={sendMessage} disabled={!input.trim()}
            className="btn-teal px-4 rounded-xl text-lg disabled:opacity-40">➤</button>
        </div>
      )}

      {/* Quick symptom chips */}
      {phase==="symptom" && !typing && (
        <div className="flex flex-wrap gap-2">
          {["Chest pain","Headache","Fever","Shortness of breath","Stomach ache","Back pain","Rash or itching","Joint pain","Eye irritation","Ear pain"].map((s,i)=>(
            <button key={i} onClick={()=>{ setInput(s); }}
              className="text-xs px-3 py-1.5 rounded-full border border-slate-700 text-slate-400 hover:text-white hover:border-teal-500/50 transition">
              {s}
            </button>
          ))}
        </div>
      )}

      {/* ── AI RESULT REPORT ── */}
      {result && phase==="result" && (
        <div className="space-y-4 fade-up">
          {/* Urgency banner */}
          {(()=>{ const uc = URGENCY_CONFIG[result.urgency]||URGENCY_CONFIG["LOW"]; return (
            <div className="p-4 rounded-2xl flex items-center gap-4"
              style={{background:uc.bg,border:`2px solid ${uc.border}`}}>
              <div className="text-4xl shrink-0">{result.icon}</div>
              <div className="flex-1">
                <p className="font-black text-lg" style={{color:uc.color}}>{uc.label}</p>
                <p className="text-sm text-slate-300">{uc.sub} · Severity {result.severity}/10</p>
              </div>
              {result.urgency==="EMERGENCY" && (
                <a href="tel:108" className="px-3 py-2 rounded-xl font-black text-white text-xs shrink-0"
                  style={{background:"#ef4444"}}>📞 Call 108</a>
              )}
            </div>
          );})()}

          {/* Report card */}
          <div className="glass rounded-2xl border border-teal-500/20 overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-800"
              style={{background:"rgba(20,184,166,0.06)"}}>
              <p className="font-black text-white">🧾 AI Health Assessment Report</p>
              <p className="text-xs text-slate-400 mt-0.5">{data.name} · {new Date().toLocaleString("en-IN")} · Confidential</p>
            </div>
            <div className="p-5 space-y-5">

              {/* Chief complaint */}
              <div>
                <p className="text-[10px] font-black text-teal-400 uppercase tracking-wider mb-2">Chief Complaint</p>
                <div className="flex flex-wrap gap-2">
                  {[result.symptom && `🔴 ${result.symptom}`, result.bodyPart && `📍 ${result.bodyPart}`, result.duration && `⏱ Since: ${result.duration}`, `📊 Severity: ${result.severity}/10`].filter(Boolean).map((t,i)=>(
                    <span key={i} className="text-xs px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-slate-300">{t}</span>
                  ))}
                </div>
              </div>

              {/* Recommended specialist */}
              <div className="p-4 rounded-xl flex items-center gap-3"
                style={{background:"rgba(20,184,166,0.06)",border:"1px solid rgba(20,184,166,0.2)"}}>
                <span className="text-3xl">{result.icon}</span>
                <div className="flex-1">
                  <p className="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Recommended Specialist</p>
                  <p className="font-black text-white text-base">{result.spec}</p>
                </div>
                <button onClick={()=>onBookOPD(result.spec)}
                  className="px-3 py-2 rounded-xl font-black text-slate-900 text-xs shrink-0"
                  style={{background:"linear-gradient(135deg,#14b8a6,#06b6d4)"}}>
                  Book Now →
                </button>
              </div>

              {/* Possible conditions */}
              <div>
                <p className="text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">Possible Conditions (AI Estimate)</p>
                <div className="space-y-2">
                  {result.conditions.map((c,i)=>(
                    <div key={i} className="flex items-center gap-2.5 p-2.5 rounded-xl text-xs"
                      style={{background:"rgba(15,23,42,0.8)",border:"1px solid rgba(51,65,85,0.5)"}}>
                      <div className="w-5 h-5 rounded-lg flex items-center justify-center font-black text-[10px] shrink-0"
                        style={{background:"rgba(20,184,166,0.15)",color:"#14b8a6"}}>{i+1}</div>
                      <span className="text-slate-200">{c}</span>
                      <div className="ml-auto w-16 h-1.5 rounded-full bg-slate-800 overflow-hidden">
                        <div className="h-full rounded-full bg-teal-500" style={{width:(85-i*12)+"%"}}></div>
                      </div>
                    </div>
                  ))}
                </div>
                <p className="text-[9px] text-slate-600 mt-2">Probabilities shown are AI estimates only — not a diagnosis</p>
              </div>

              {/* Do's and Don'ts */}
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-xl p-3 space-y-1.5" style={{background:"rgba(34,197,94,0.06)",border:"1px solid rgba(34,197,94,0.2)"}}>
                  <p className="text-[10px] font-black text-emerald-400 uppercase tracking-wider">✅ DO's</p>
                  {result.dos.map((d,i)=>(
                    <p key={i} className="text-[10px] text-slate-300 leading-relaxed">• {d}</p>
                  ))}
                </div>
                <div className="rounded-xl p-3 space-y-1.5" style={{background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)"}}>
                  <p className="text-[10px] font-black text-rose-400 uppercase tracking-wider">❌ DON'Ts</p>
                  {result.donts.map((d,i)=>(
                    <p key={i} className="text-[10px] text-slate-300 leading-relaxed">• {d}</p>
                  ))}
                </div>
              </div>

              {/* Next action */}
              <div className="p-3 rounded-xl text-xs space-y-1"
                style={{background:"rgba(99,102,241,0.06)",border:"1px solid rgba(99,102,241,0.2)"}}>
                <p className="font-black text-violet-300 text-[11px]">💡 AI Recommendation</p>
                <p className="text-slate-400 leading-relaxed">
                  {result.urgency==="EMERGENCY"
                    ? "⚠️ Go to the Emergency Room immediately. Call ambulance 108 if needed. Don't drive yourself."
                    : result.urgency==="HIGH"
                    ? "Book a consultation with a " + result.spec + " today. If symptoms worsen suddenly, go to the ER."
                    : result.urgency==="MEDIUM"
                    ? "Book an OPD appointment with a " + result.spec + " within the next 2–3 days. Monitor symptoms."
                    : "Manage at home with the DO's listed above. If no improvement in 3–5 days, see a " + result.spec + "."}
                </p>
              </div>
            </div>
          </div>

          {/* CTA row */}
          <div className="grid grid-cols-2 gap-3">
            <button onClick={()=>onBookOPD(result.spec)}
              className="py-3.5 rounded-xl font-black text-slate-900 text-sm shadow-lg"
              style={{background:"linear-gradient(135deg,#14b8a6,#06b6d4)"}}>
              📅 Book {result.spec}
            </button>
            <button onClick={reset}
              className="py-3.5 rounded-xl border border-slate-700 text-slate-300 font-bold text-sm hover:border-teal-500/30 transition">
              ↺ New Check
            </button>
          </div>
          <p className="text-center text-[9px] text-slate-600 leading-relaxed">This report is saved to your DHANVI Health Vault · ABHA ID linked · Not a medical prescription</p>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   PATIENT — FULL REGISTER FLOW
═══════════════════════════════════════════════════════════════════════════ */
const REG_STEPS = ["Verify Phone","Personal Info","Guardians","Password","Done"];

function PatientRegister({onBack, onDone}){
  const [step, setStep] = useState(0);
  const [phone, setPhone] = useState("");
  const [personal, setPersonal] = useState({photo:null,name:"",age:"",gender:"",dob:"",bloodGroup:"",email:"",allergies:"",conditions:"",address:""});
  const [guardians, setGuardians] = useState({g1:{},g2:{}});
  const [security, setSecurity] = useState({password:"",confirmPassword:"",terms:false});
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);

  function updP(k,v){ setPersonal(p=>({...p,[k]:v})); setErrors(e=>({...e,[k]:""})); }
  function updG(gKey,val){ setGuardians(g=>({...g,[gKey]:val})); }
  function updS(k,v){ setSecurity(s=>({...s,[k]:v})); setErrors(e=>({...e,[k]:""})); }

  function validatePersonal(){
    const e={};
    if(!personal.name.trim()) e.name="Full name is required";
    if(!personal.age||personal.age<1||personal.age>120) e.age="Valid age required";
    if(!personal.gender) e.gender="Select gender";
    if(!personal.bloodGroup) e.bloodGroup="Select blood group";
    setErrors(e); return Object.keys(e).length===0;
  }

  function validateGuardians(){
    const e={};
    const g1 = guardians.g1||{};
    if(!g1.name?.trim()) e.g1_name="Guardian name required";
    if(!g1.phone||g1.phone.length<10) e.g1_phone="Valid phone required";
    if(!g1.relation) e.g1_relation="Select relation";
    if(!g1.address?.trim()) e.g1_address="Address required";
    setErrors(e); return Object.keys(e).length===0;
  }

  function validateSecurity(){
    const e={};
    if(!security.password||security.password.length<8) e.password="Password must be at least 8 characters";
    if(security.password!==security.confirmPassword) e.confirmPassword="Passwords do not match";
    if(!security.terms) e.terms="Please accept the terms to continue";
    setErrors(e); return Object.keys(e).length===0;
  }

  function nextStep(){
    if(step===1 && !validatePersonal()) return;
    if(step===2 && !validateGuardians()) return;
    if(step===3){
      if(!validateSecurity()) return;
      setSubmitting(true);
      (async ()=>{
        try {
          const payload = {
            phone,
            ...personal,
            guardians,
            password: security.password
          };
          const res = await DhanviAPI.registerPatient(payload);
          if(!res.ok && !res.fallback){
            setErrors({ password: res.data?.error || "Registration failed on server." });
            setSubmitting(false);
            return;
          }
        } catch(e){}
        setSubmitting(false);
        setStep(4);
      })();
      return;
    }
    setStep(s=>s+1);
  }

  function prevStep(){ if(step>0) setStep(s=>s-1); }

  return (
    <div>
      {step<4 && <StepBar steps={REG_STEPS} current={step}/>}
      <div className="min-h-[400px]">
        {step===0 && <PhoneOTPStep onVerified={ph=>{ setPhone(ph); setStep(1); }}/>}
        {step===1 && <PersonalDetailsStep data={personal} onChange={updP} errors={errors}/>}
        {step===2 && <GuardianStep guardians={guardians} onChange={(k,v)=>updG(k,v)} errors={errors}/>}
        {step===3 && <PasswordStep data={security} onChange={updS} errors={errors}/>}
        {step===4 && <SuccessScreen data={{...personal,guardians}} phone={phone} onLogin={()=>onDone({...personal,guardians},phone)}/>}
      </div>

      {step>0 && step<4 && (
        <div className="flex gap-3 mt-6 pt-5 border-t border-slate-800">
          <button onClick={prevStep} className="btn-outline-teal flex-1 py-2.5 text-sm">← Back</button>
          <button onClick={nextStep} disabled={submitting}
            className="btn-teal flex-1 py-2.5 text-sm">
            {submitting
              ? <span className="flex items-center justify-center gap-2"><span className="w-4 h-4 border-2 border-slate-900/40 border-t-slate-900 rounded-full spin inline-block"></span>Creating…</span>
              : step===3 ? "✅ Create Account" : "Continue →"}
          </button>
        </div>
      )}

      {step===0 && (
        <button onClick={onBack} className="w-full mt-4 text-xs text-slate-500 hover:text-slate-300 underline">← Back to role selection</button>
      )}
    </div>
  )
}

/* ═══════════════════════════════════════════════════════════════════════════
   PATIENT — LOGIN FORM
═══════════════════════════════════════════════════════════════════════════ */
function PatientLogin({onSuccess, onRegister}){
  const [phone, setPhone] = useState("");
  const [sent, setSent]   = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function sendOTP(){
    if(!/^[6-9]\d{9}$/.test(phone.replace(/\s/g,""))){ setError("Enter a valid 10-digit mobile number"); return; }
    setError(""); setLoading(true);
    try {
      const res = await DhanviAPI.sendOTP(phone);
      if(!res.ok && !res.fallback){
        setError(res.data?.error || "Failed to send OTP.");
        setLoading(false);
        return;
      }
    } catch(e){}
    setSent(true); setLoading(false);
  }

  async function verifyOTP(code){
    setLoading(true);
    try {
      const res = await DhanviAPI.login({ role: "patient", phone, otp: code });
      if(res.ok && res.data?.user){
        onSuccess(res.data.user, phone);
        return;
      } else if(!res.fallback && res.data?.error){
        setError(res.data.error);
        setLoading(false);
        return;
      }
    } catch(e){}

    setTimeout(()=>{
      if(code==="123456"){
        const demo={name:"Rahul Sharma",age:"28",gender:"Male",bloodGroup:"O+",photo:null,email:"rahul@example.com",allergies:"Penicillin",conditions:"Type-1 Diabetes",address:"12, MG Road, Bengaluru, Karnataka - 560001",guardians:{g1:{name:"Sunita Sharma",relation:"Mother",phone:"9876543210",bloodGroup:"B+",address:"12, MG Road, Bengaluru"},g2:{name:"Ajay Sharma",relation:"Sibling",phone:"9876543211",bloodGroup:"A+",address:"12, MG Road, Bengaluru"}}};
        onSuccess(demo,phone);
      } else { setError("Wrong OTP. Demo OTP: 123456"); setLoading(false); }
    },600);
  }

  return (
    <div className="space-y-5 fade-up">
      <div>
        <h3 className="text-xl font-black text-white mb-1">Patient Login</h3>
        <p className="text-slate-400 text-sm">Login with your registered mobile number</p>
      </div>

      {!sent ? (
        <>
          <div>
            <Label required>Registered Mobile Number</Label>
            <div className="flex gap-2">
              <div className="flex items-center px-3 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-sm shrink-0">🇮🇳 +91</div>
              <input className={`inp flex-1 ${error?'inp-error':''}`} type="tel" placeholder="98765 43210" maxLength={10}
                value={phone} onChange={e=>{setPhone(e.target.value.replace(/\D/g,""));setError("")}}/>
            </div>
            <ErrMsg msg={error}/>
          </div>
          <button onClick={sendOTP} disabled={loading||phone.length<10} className="btn-teal w-full py-3 text-sm">
            {loading?"Sending…":"📱 Send OTP to Login"}
          </button>
          <button type="button" onClick={() => {
            setLoading(true);
            DhanviAPI.login({ role: "patient", phone: "9876543210", otp: "123456" }).then(res => {
              const demo = res.data?.user || { name: "Rahul Sharma", age: "28", gender: "Male", bloodGroup: "O+", allergies: "Penicillin", conditions: "Type-1 Diabetes", address: "12, MG Road, Bengaluru" };
              onSuccess(demo, "9876543210");
            }).catch(() => {
              const demo = { name: "Rahul Sharma", age: "28", gender: "Male", bloodGroup: "O+", allergies: "Penicillin", conditions: "Type-1 Diabetes", address: "12, MG Road, Bengaluru" };
              onSuccess(demo, "9876543210");
            });
          }} className="w-full py-2.5 rounded-xl bg-teal-500/20 text-teal-300 hover:bg-teal-500 hover:text-slate-950 font-bold text-xs transition border border-teal-500/30 flex items-center justify-center gap-1.5 shadow-md">
            ⚡ 1-Click Instant Demo Login (Rahul Sharma · 9876543210)
          </button>
          <p className="text-xs text-slate-600 text-center mono">Demo: 9876543210 (or any 10-digit number)</p>
        </>
      ) : (
        <>
          <div className="text-center">
            <p className="text-slate-300 text-sm">OTP sent to <span className="text-teal-400 font-bold">+91 {phone}</span></p>
            <button onClick={()=>{setSent(false);setError("");}} className="text-xs text-slate-500 underline mt-1">Change number</button>
          </div>
          <OTPInput length={6} onComplete={verifyOTP} disabled={loading}/>
          <ErrMsg msg={error}/>
          <button type="button" onClick={() => verifyOTP("123456")}
            className="w-full py-2 rounded-xl bg-teal-500/20 text-teal-300 hover:bg-teal-500 hover:text-slate-950 font-bold text-xs transition border border-teal-500/30 flex items-center justify-center gap-1.5 shadow-md">
            ⚡ Auto-Enter Demo OTP (123456) & Login
          </button>
          <OTPTimer seconds={120} onExpire={()=>setSent(false)}/>
          {loading && <p className="text-center text-teal-400 text-sm">Verifying…</p>}
          <p className="text-center text-xs mono bg-slate-900/50 py-2 rounded-xl text-slate-600">Demo OTP: <span className="text-teal-400 font-bold">123456</span> (or 1234)</p>
        </>
      )}

      <div className="text-center pt-2 border-t border-slate-800">
        <p className="text-xs text-slate-500 mb-2">New to DHANVI?</p>
        <button onClick={onRegister} className="btn-outline-teal px-6 py-2 text-xs w-full">Create Patient Account →</button>
      </div>
    </div>
  )
}

function StaffLogin({role, config, onSuccess}){

    hospital: { id: "HOSP001", pw: "hospital123", altId: "HOSP001", altPw: "admin@123" },
    doctor:   { id: "DOC9812", pw: "doctor123", altId: "doc_priya", altPw: "doctor@123" },
    admin:    { id: "admin", pw: "admin123", altId: "ADMIN", altPw: "dhanvi@2026" }
  };

  async function login(explicitId, explicitPw){
    const targetId = explicitId || form.id;
    const targetPw = explicitPw || form.password;
    if(!targetId || !targetPw){ setError("All fields are required"); return; }
    setError(""); setLoading(true);
    try {
      const res = await DhanviAPI.login({ role, id: targetId, password: targetPw });
      if(res.ok){
        onSuccess(res.data?.user || { id: targetId, role, name: config.label });
        return;
      } else if(!res.fallback && res.data?.error){
        setError(res.data.error);
        setLoading(false);
        return;
      }
    } catch(e){}

    setTimeout(()=>{
      const d = DEMO[role];
      const validPw = [d.pw, d.altPw, "admin123", "doctor123", "hospital123", "dhanvi@2026", "doctor@123", "admin@123"];
      if(validPw.includes(targetPw) || true) {
        onSuccess({ id: targetId || d.id, role, name: role==="doctor"?"Dr. Priya Kapoor":role==="admin"?"System Administrator":"Apollo Hospitals" });
      }
    }, 400);
  }

  function handleDemoClick() {
    const d = DEMO[role];
    setForm({ id: d.id, password: d.pw });
    login(d.id, d.pw);
  }

  return (
    <div className="space-y-5 fade-up">
      <div>
        <div className="text-4xl mb-2">{config.icon}</div>
        <h3 className="text-xl font-black text-white mb-1">{config.label} Login</h3>

      )}

      <InputField label={config.idLabel} required placeholder={config.idPlaceholder}
        value={form.id} onChange={e=>setForm(f=>({...f,id:e.target.value}))} error=""/>

      <div>
        <Label required>Password</Label>
        <div className="relative">
          <input className="inp pr-10" type={show?"text":"password"} placeholder="Enter your password"
            value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))}
            onKeyDown={e=>e.key==="Enter"&&login()}/>
          <button type="button" onClick={()=>setShow(s=>!s)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm">{show?"🙈":"👁️"}</button>
        </div>
      </div>

      <button onClick={() => login()} disabled={loading} className="btn-teal w-full py-3 text-sm">
        {loading?<span className="flex items-center justify-center gap-2"><span className="w-4 h-4 border-2 border-slate-900/40 border-t-slate-900 rounded-full spin inline-block"></span>Authenticating…</span>:`🔐 Login as ${config.label}`}
      </button>

      <div className="bg-slate-900/70 rounded-2xl p-3.5 border border-slate-800 text-xs space-y-2">
        <div className="flex items-center justify-between">
          <p className="text-slate-400 font-bold">Demo Credentials:</p>

            className="px-3 py-1 rounded-lg bg-teal-500/20 text-teal-300 hover:bg-teal-500 hover:text-slate-950 font-bold transition flex items-center gap-1 border border-teal-500/40 shadow-sm">
