    /* ── Gradient text ── */
    .grad-text {
      background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .grad-text-rose {
      background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── Glassmorphism card ── */
    .glass {
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(20,184,166,0.15);
    }
    .glass-hover:hover {
      background: rgba(20,184,166,0.06);
      border-color: rgba(20,184,166,0.35);
      transform: translateY(-3px);
      box-shadow: 0 20px 60px rgba(20,184,166,0.12);
    }

    /* ── Animations ── */
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes pulse-glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(20,184,166,0.4); }
      50%      { box-shadow: 0 0 0 20px rgba(20,184,166,0); }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fade-up {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }
    @keyframes ping-ring {
      0%   { transform: scale(0.9); opacity: 0.8; }
      50%  { transform: scale(1.08); opacity: 0.25; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes gradient-shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes count-up { from { opacity:0; } to { opacity:1; } }

    .float-anim    { animation: float 4s ease-in-out infinite; }
    .pulse-glow    { animation: pulse-glow 2.5s ease-in-out infinite; }
    .spin-slow     { animation: spin-slow 18s linear infinite; }
    .fade-up       { animation: fade-up 0.7s ease forwards; }
    .ping-ring     { animation: ping-ring 2.5s ease-in-out infinite; }
    .ticker-anim   { animation: ticker 30s linear infinite; }

    .hero-gradient {
      background: linear-gradient(-45deg, #020817, #0f172a, #042f2e, #0c1445);
      background-size: 400% 400%;
      animation: gradient-shift 12s ease infinite;
    }

    /* ── Grid lines bg ── */
    .grid-bg {
      background-image:
        linear-gradient(rgba(20,184,166,0.04) 1px, transparent 1px),
        linear-gradient(90deg,rgba(20,184,166,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Nav ── */
    .nav-blur {
      background: rgba(2,8,23,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(20,184,166,0.12);
    }

    /* ── Stat counter ── */
    .stat-card {
      background: linear-gradient(135deg, rgba(20,184,166,0.08), rgba(6,182,212,0.04));
      border: 1px solid rgba(20,184,166,0.2);
    }

    /* ── CTA Button ── */
    .btn-primary {
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      transition: all 0.3s ease;
      position: relative; overflow: hidden;
    }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, #06b6d4, #818cf8);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary span { position: relative; z-index: 1; }

    .btn-outline {
      border: 1px solid rgba(20,184,166,0.5);
      transition: all 0.3s ease;
    }
    .btn-outline:hover {
      background: rgba(20,184,166,0.1);
      border-color: #14b8a6;
      box-shadow: 0 0 20px rgba(20,184,166,0.2);

    ::-webkit-scrollbar-track { background: #020817; }
    ::-webkit-scrollbar-thumb { background: #14b8a6; border-radius: 3px; }

    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }

function GoogleHospitalMap({ hospitals = HOSPITALS_DEMO, selectedHospital, onSelectHospital, height = "360px", showRoute = false, activeAmbulance = false }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const routeLineRef = useRef(null);
  const [mapReady, setMapReady] = useState(false);
  const [mapFailed, setMapFailed] = useState(false);
  const [activeType, setActiveType] = useState("roadmap");
  const userCoords = { lat: 12.9352, lng: 77.6245 };

  useEffect(() => {
    function onFail() { setMapFailed(true); }
    window.addEventListener("dhanvi_gm_fail", onFail);
    return () => window.removeEventListener("dhanvi_gm_fail", onFail);
  }, []);

  useEffect(() => {
    if (window.__dhanvi_gm_error) {
      setMapFailed(true);
      return;
    }

    if (!window.google || !window.google.maps || !window.google.maps.Map) {
      const timer = setTimeout(() => {
        if (!window.google || !window.google.maps || !window.google.maps.Map) {
          setMapFailed(true);
        }
      }, 2500);
      return () => clearTimeout(timer);
    }

    try {
      if (!mapRef.current) return;
      const isClassic = document.body.classList.contains("theme-classic");
      const map = new window.google.maps.Map(mapRef.current, {
        center: { lat: 12.9380, lng: 77.6150 },
        zoom: 13,
        styles: isClassic ? null : DHANVI_MAP_STYLES,
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });

      mapInstanceRef.current = map;

      new window.google.maps.Marker({
        position: userCoords,
        map: map,
        title: "Your Location (DHANVI GPS)",
        icon: {
          path: window.google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: "#0284c7",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2,
        }
      });

      markersRef.current.forEach(m => m.marker.setMap(null));
      markersRef.current = [];

      const created = hospitals.map(h => {
        const marker = new window.google.maps.Marker({
          position: { lat: h.lat || 12.9345, lng: h.lng || 77.6101 },
          map: map,
          title: h.name,
          icon: {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
            fillColor: h.color === "teal" || h.color === "#14b8a6" ? "#0284c7" : h.color === "rose" || h.color === "#f43f5e" ? "#e11d48" : "#7c3aed",
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 1.5,
            scale: 1.5,
            anchor: new window.google.maps.Point(12, 22),
          }
        });

        const info = new window.google.maps.InfoWindow({
          content: '<div style="background:' + (isClassic ? '#ffffff' : '#0f172a') + ';color:' + (isClassic ? '#0f172a' : '#f8fafc') + ';padding:10px 14px;border-radius:12px;font-family:sans-serif;min-width:170px;border:1px solid ' + (isClassic ? '#0284c7' : '#14b8a6') + ';box-shadow:0 4px 16px rgba(0,0,0,0.12);">' +
            '<div style="font-weight:bold;font-size:14px;color:' + (isClassic ? '#0f172a' : '#fff') + ';">' + h.name + '</div>' +
            '<div style="font-size:12px;color:' + (isClassic ? '#64748b' : '#94a3b8') + ';margin-top:2px;">' + (h.type || "Hospital") + ' · ' + h.dist + '</div>' +
            '<div style="margin-top:6px;display:flex;gap:6px;align-items:center;">' +
              '<span style="background:' + (isClassic ? '#e0f2fe' : 'rgba(20,184,166,0.2)') + ';color:' + (isClassic ? '#0369a1' : '#2dd4bf') + ';padding:2px 8px;border-radius:6px;font-size:11px;font-weight:bold;">🛏️ ' + h.beds + ' Beds</span>' +
              '<span style="color:#d97706;font-size:11px;font-weight:bold;">★ ' + h.rating + '</span>' +
            '</div>' +
          '</div>'

function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ─── DHANVI AI VOICE ENGINE (Web Speech API) ────────────────────────────── */
const DhanviVoice = {
  isSupported: typeof window !== "undefined" && ("speechSynthesis" in window || "webkitSpeechRecognition" in window || "SpeechRecognition" in window),
  speaking: false,
  listening: false,
  recognition: null,

  speak(text, onStart, onEnd, lang = "te-IN") {
    if (typeof window === "undefined" || !("speechSynthesis" in window)) return false;
    window.speechSynthesis.cancel();

    const cleanText = text
      .replace(/\*\*(.*?)\*\*/g, "$1")
      .replace(/\*(.*?)\*/g, "$1")
      .replace(/#{1,6}\s?/g, "")
      .replace(/\[(.*?)\]\(.*?\)/g, "$1")
      .replace(/[•▸\-\*▸]\s/g, "")
      .replace(/`/g, "")
      .replace(/[🚨⚡🤖🏥💊🩸✓💡⚠️👨‍⚕️🧪]/g, "")
      .trim();

    if (!cleanText) return false;

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.rate = 0.92;
    utterance.pitch = 1.0;

    const hasTelugu = /[\u0c00-\u0c7f]/.test(cleanText) || (lang && lang.startsWith("te"));
    const targetLang = hasTelugu ? "te-IN" : lang;
    utterance.lang = targetLang;

    const voices = window.speechSynthesis.getVoices();
    let preferredVoice = null;
    if (hasTelugu) {
      preferredVoice = voices.find(v => 
        (v.lang && (v.lang.toLowerCase().startsWith("te") || v.lang.toLowerCase().replace('_', '-').includes("te-in") || v.lang.toLowerCase().includes("telugu"))) ||
        (v.name && v.name.toLowerCase().includes("telugu"))
      );
      // Note: If no local Telugu voice is found, do NOT fallback to an English voice.
      // Keeping utterance.voice unset and utterance.lang='te-IN' allows Chrome, Edge, and Android
      // to resolve their online Telugu TTS engine without speech synthesizer errors.
    } else {
      preferredVoice = voices.find(v => v.lang.includes("en-IN") || v.name.includes("India")) ||
                       voices.find(v => v.lang.includes("en-GB") || v.name.includes("Natural") || v.name.includes("Google")) ||
                       voices.find(v => v.lang.startsWith("en"));
    }
    if (preferredVoice) utterance.voice = preferredVoice;

    utterance.onstart = () => {
      this.speaking = true;
      if (onStart) onStart();
    };
    utterance.onend = () => {
      this.speaking = false;
      if (onEnd) onEnd();
    };
    utterance.onerror = () => {
      this.speaking = false;
      if (onEnd) onEnd();
    };

    window.speechSynthesis.speak(utterance);
    return true;
  },

  stop() {
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    this.speaking = false;
  },

  startListening(onResult, onEnd, onError, lang = "te-IN") {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      if (onError) onError("Microphone voice recognition is not supported in this browser. Please use Chrome or Edge.");
      return null;
    }
    this.stop();
    try {
      const rec = new SpeechRec();
      rec.lang = lang;
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      rec.onstart = () => { this.listening = true; };
      rec.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join("");
        const isFinal = e.results[0].isFinal;
        if (onResult) onResult(transcript, isFinal);
      };
      rec.onerror = (err) => {
        this.listening = false;
        if (onError) onError(err.error || "Microphone error");
      };
      rec.onend = () => {
        this.listening = false;
        if (onEnd) onEnd();
      };

      rec.start();
      this.recognition = rec;
      return rec;
    } catch(err) {
      if (onError) onError(err.message);
      return null;
    }
  },

  stopListening() {
    if (this.recognition) {
      try { this.recognition.stop(); } catch(e){}
    }
    this.listening = false;
  }
};

    {
      role: "assistant",
      content: "నమస్కారం! నేను **ధన్వి క్లినికల్ ఏఐ డాక్టర్ (DHANVI Clinical AI Copilot)**, డబ్ల్యూహెచ్ఓ (WHO) డిజిటల్ హెల్త్ మార్గదర్శకాల ప్రకారం పనిచేస్తున్నాను.\n\nమీ ఆరోగ్య సమస్య లేదా లక్షణాలను ఇక్కడ తెలుగులో టైప్ చేయండి లేదా 🎙️ **మైక్ బటన్** నొక్కి మాట్లాడండి. నేను తక్షణమే అత్యవసర సంకేతాలను విశ్లేషించి, సరైన స్పెషలిస్ట్ డాక్టర్‌ను మరియు 10-నిమిషాల సూపర్ ఓపీని సిఫార్సు చేస్తాను."
    }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [voiceEnabled, setVoiceEnabled] = useState(true);
  const [isListening, setIsListening] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [activeVoiceIndex, setActiveVoiceIndex] = useState(null);
  const [voiceStatus, setVoiceStatus] = useState("");
  const messagesEndRef = useRef(null);

  const quickChipsEn = [
    "Severe chest pain radiating to left arm",
    "Fever for 3 days with chills & sore throat",
    "Sudden dizziness & facial numbness",
    "Burning stomach pain after meals",
    "Check allergy safety for Penicillin"
  ];

  const quickChipsTe = [
    "ఛాతీలో తీవ్రమైన నొప్పి & చెమటలు",
    "3 రోజులుగా చలి జ్వరం & గొంతు నొప్పి",
    "కళ్లు తిరగడం, తలనొప్పి & నీరసం",
    "కడుపులో విపరీతమైన మంట & గ్యాస్",
    "ఆయాసం & శ్వాస తీసుకోవడంలో కష్టం"
  ];

  const activeChips = language === "te" ? quickChipsTe : quickChipsEn;

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  // Clean up speech on unmount or close
  useEffect(() => {
    return () => {
      DhanviVoice.stop();
      DhanviVoice.stopListening();
    };
  }, []);

  // Listen to auto-voice trigger
  useEffect(() => {
    const handleVoiceStart = () => {
      toggleMic();
    };
    window.addEventListener("start_ai_voice", handleVoiceStart);
    return () => window.removeEventListener("start_ai_voice", handleVoiceStart);
  }, [language]);

  function switchLanguage(newLang) {
    if (newLang === language) return;
    setLanguage(newLang);
    DhanviVoice.stop();
    setIsSpeaking(false);
    setActiveVoiceIndex(null);

    // If initial greeting is the only message, update it to the selected language
    if (messages.length === 1 && messages[0].role === "assistant") {
      if (newLang === "te") {
        setMessages([{
          role: "assistant",
          content: "నమస్కారం! నేను **DHANVI క్లినికల్ ఏఐ డాక్టర్ (Clinical AI Copilot)**, డబ్ల్యూహెచ్ఓ (WHO) డిజిటల్ హెల్త్ ప్రమాణాల ప్రకారం పనిచేస్తాను.\n\nమీ ఆరోగ్య సమస్యలను ఇక్కడ టైప్ చేయవచ్చు లేదా **🎙️ మైక్రోఫోన్** నొక్కి తెలుగులో మాట్లాడవచ్చు. నేను అత్యవసర ప్రమాదాలను గుర్తించి, సరైన వైద్య నిపుణుడిని మరియు తదుపరి సంరక్షణను సూచిస్తాను."
        }]);
      } else {
        setMessages([{
          role: "assistant",
          content: "Hello! I am **DHANVI Clinical AI Copilot**, adhering to WHO Digital Health Guidelines.\n\nDescribe your symptoms or questions by typing or tapping the **🎙️ microphone** to speak. I will assess clinical urgency, screen for emergency red flags, and guide you to the right specialist."
        }]);
      }
    }
  }

  function toggleMic() {
    if (isListening) {
      DhanviVoice.stopListening();
      setIsListening(false);
      setVoiceStatus("");
    } else {
      DhanviVoice.stop();
      setIsSpeaking(false);
      setActiveVoiceIndex(null);
      const listenMsg = language === "te"
        ? "వింటున్నాను... మీ సమస్యను తెలుగులో స్పష్టంగా చెప్పండి"
        : "Listening... Speak your symptoms clearly";
      setVoiceStatus(listenMsg);
      setIsListening(true);

      const speechLang = language === "te" ? "te-IN" : "en-IN";
      DhanviVoice.startListening(
        (transcript, isFinal) => {
          setInput(transcript);
          setVoiceStatus(`"${transcript}"`);
          if (isFinal && transcript.trim()) {
            setIsListening(false);
            setVoiceStatus("");
            setTimeout(() => handleSend(transcript), 400);
          }
        },
        () => {
          setIsListening(false);
          setVoiceStatus("");
        },
        (err) => {
          setIsListening(false);
          setVoiceStatus("Voice input error: " + err);
          setTimeout(() => setVoiceStatus(""), 3500);
        },
        speechLang
      );
    }
  }

  function handleSpeakMessage(text, idx) {
    if (isSpeaking && activeVoiceIndex === idx) {
      DhanviVoice.stop();
      setIsSpeaking(false);
      setActiveVoiceIndex(null);
    } else {
      setActiveVoiceIndex(idx);
      setIsSpeaking(true);
      const speechLang = (language === "te" || /[\u0c00-\u0c7f]/.test(text)) ? "te-IN" : "en-IN";
      DhanviVoice.speak(
        text,
        () => setIsSpeaking(true),
        () => {
          setIsSpeaking(false);
          setActiveVoiceIndex(null);
        },
        speechLang
      );
    }
  }

  async function handleSend(textToSend) {
    const text = (textToSend || input).trim();
    if (!text || loading) return;

    if (isListening) {
      DhanviVoice.stopListening();
      setIsListening(false);
    }
    DhanviVoice.stop();
    setIsSpeaking(false);

    // Auto-detect Telugu characters in input text
    const isTeText = /[\u0c00-\u0c7f]/.test(text);
    const activeLang = isTeText ? "te" : language;
    if (isTeText && language !== "te") {
      setLanguage("te");
    }

    const newMessages = [...messages, { role: "user", content: text }];
    setMessages(newMessages);
    setInput("");
    setLoading(true);

    try {
      const res = await fetch("/api/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: newMessages.slice(-5),
          patient_id: "9876543210",
          language: activeLang
        })
      });
      const data = await res.json();
      if (data.success) {
        const replyText = data.reply;
        const newIdx = newMessages.length;
        setMessages(prev => [...prev, {
          role: "assistant",
          content: replyText,
          triage: data.triage
        }]);

        // Auto speak response if voice enabled
        if (voiceEnabled) {
          setActiveVoiceIndex(newIdx);
          setIsSpeaking(true);
          const speechLang = (activeLang === "te" || /[\u0c00-\u0c7f]/.test(replyText)) ? "te-IN" : "en-IN";
          DhanviVoice.speak(
            replyText,
            () => setIsSpeaking(true),
            () => {
              setIsSpeaking(false);
              setActiveVoiceIndex(null);
            },
            speechLang
          );
        }
      } else {
        setMessages(prev => [...prev, {
          role: "assistant",
          content: language === "te"
            ? "క్షమించండి, మీ ప్రశ్నను ప్రాసెస్ చేయడంలో లోపం ఎదురైంది. దయచేసి మళ్లీ ప్రయత్నించండి లేదా అత్యవసర సహాయం తీసుకోండి."
            : "Sorry, I encountered an issue processing your clinical query. Please try again or seek direct emergency assistance."
        }]);
      }
    } catch (err) {
      setMessages(prev => [...prev, {
        role: "assistant",
        content: "Error reaching Clinical AI Engine: " + err.message
      }]);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
      <div className="relative w-full max-w-xl bg-white text-slate-900 rounded-3xl shadow-2xl border border-slate-200 overflow-hidden h-[85vh] flex flex-col">
        {/* Header */}
        <div className="bg-gradient-to-r from-teal-600 via-sky-700 to-indigo-800 text-white p-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center text-2xl relative">
              <span>🤖</span>
              {isSpeaking && (
                <span className="absolute -top-1 -right-1 w-3 h-3 bg-emerald-400 rounded-full animate-ping"></span>
              )}
            </div>
            <div>
              <h2 className="text-base font-black tracking-tight leading-none flex items-center gap-2">
                <span>{language === "te" ? "DHANVI ఏఐ డాక్టర్ (AI Doctor)" : "DHANVI CLINICAL AI COPILOT"}</span>
                <span className="text-[10px] bg-teal-400 text-slate-950 px-2 py-0.5 rounded-full font-bold">
                  {language === "te" ? "తెలుగు వాయిస్" : "LIVE AI VOICE"}
                </span>
              </h2>
              <p className="text-[11px] text-teal-100 mt-0.5">
                {language === "te" ? "డబ్ల్యూహెచ్ఓ (WHO) ప్రమాణాలు · స్పీచ్ & క్లినికల్ ట్రయాజ్" : "WHO Digital Health Guidelines · Interactive Speech & Triage"}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {/* Language Switcher */}
            <div className="flex items-center bg-black/25 p-0.5 rounded-xl border border-white/20 text-[10px] font-bold">
              <button onClick={() => switchLanguage("en")}
                className={`px-2 py-1 rounded-lg transition ${language === "en" ? "bg-white text-slate-900 shadow" : "text-white/80 hover:text-white"}`}>
                EN
              </button>
              <button onClick={() => switchLanguage("te")}
                className={`px-2 py-1 rounded-lg transition ${language === "te" ? "bg-teal-400 text-slate-950 shadow" : "text-white/80 hover:text-white"}`}>
                తెలుగు
              </button>
            </div>

            <button onClick={() => {
                if (isSpeaking) { DhanviVoice.stop(); setIsSpeaking(false); }
                setVoiceEnabled(!voiceEnabled);
              }}
              className={`px-2 py-1 rounded-xl text-[10px] font-bold transition flex items-center gap-1 border ${
                voiceEnabled ? "bg-emerald-400/20 text-emerald-200 border-emerald-400/50" : "bg-white/10 text-white/60 border-white/20"
              }`}>
              <span>{voiceEnabled ? "🔊 ON" : "🔇 OFF"}</span>
            </button>
            <button onClick={() => { DhanviVoice.stop(); onClose(); }}
              className="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white font-bold flex items-center justify-center transition">✕</button>
          </div>
        </div>

        {/* Messages List */}
        <div className="p-4 overflow-y-auto flex-1 space-y-4 text-xs">
          {messages.map((m, i) => {
            const isUser = m.role === "user";
            return (
              <div key={i} className={"flex gap-2.5 " + (isUser ? "justify-end" : "justify-start")}>
                {!isUser && <div className="w-7 h-7 rounded-full bg-teal-600 text-white font-bold flex items-center justify-center shrink-0 text-xs shadow">AI</div>}
                <div className={"max-w-[85%] rounded-2xl p-3.5 space-y-2 " +
                  (isUser ? "bg-teal-600 text-white rounded-tr-none" : "bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200")}>
                  <div className="whitespace-pre-line leading-relaxed font-sans">{m.content}</div>

                  {!isUser && (
                    <div className="flex items-center gap-2 pt-1">
                      <button onClick={() => handleSpeakMessage(m.content, i)}
                        className={`text-[10px] px-2 py-0.5 rounded-md font-bold transition flex items-center gap-1 border ${
                          activeVoiceIndex === i && isSpeaking
                            ? "bg-rose-100 text-rose-700 border-rose-300 animate-pulse"
                            : "bg-white text-teal-700 border-slate-200 hover:border-teal-400"
                        }`}>
                        <span>
                          {activeVoiceIndex === i && isSpeaking
                            ? (language === "te" ? "⏹ ఆపండి (Stop)" : "⏹ Stop Speaking")
                            : (language === "te" ? "🔊 వినిపించండి (Speak)" : "🔊 Read Aloud")}
                        </span>
                      </button>
                    </div>
                  )}

                  {m.triage && (
                    <div className="mt-2 pt-2 border-t border-slate-200/60 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-[10px] uppercase text-teal-700">
                          {language === "te" ? "ట్రయాజ్ స్థాయి:" : "Triage Level:"}
                        </span>
                        <span className={"px-2 py-0.5 rounded-full font-bold text-[10px] " +
                          (m.triage.red_flag_alert ? "bg-rose-100 text-rose-700 border border-rose-300" :
                           m.triage.urgency === "URGENT" ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700")}>
                          {m.triage.urgency_badge}
                        </span>
                      </div>
                      <div className="flex gap-2 pt-1">
                        <button onClick={() => { DhanviVoice.stop(); onClose(); window.dispatchEvent(new CustomEvent("open_super_op")); }}
                          className="flex-1 py-1.5 px-2 bg-gradient-to-r from-amber-500 to-rose-600 text-white rounded-lg font-bold text-[10px] shadow hover:scale-[1.02] transition">
                          ⚡ {language === "te" ? "సూపర్ ఓపీ (10-Min Super OP)" : "Launch 10-Min Super OP"}
                        </button>
                        {m.triage.red_flag_alert && (
                          <a href="tel:108"
                            className="py-1.5 px-2 bg-rose-600 text-white rounded-lg font-bold text-[10px] flex items-center justify-center hover:bg-rose-500 transition">
                            🚨 {language === "te" ? "108 అంబులెన్స్" : "Call 108"}
                          </a>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
          {loading && (
            <div className="flex gap-2.5 items-center text-slate-400 text-xs pl-2">
              <div className="w-2 h-2 rounded-full bg-teal-500 animate-ping"></div>
              <span>{language === "te" ? "ధన్వి ఏఐ లక్షణాలను విశ్లేషిస్తోంది..." : "Clinical AI analyzing symptoms..."}</span>
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>

        {/* Sound Wave / Voice Status Indicator */}
        {(isListening || isSpeaking || voiceStatus) && (
          <div className="px-4 py-2 bg-slate-900 text-white flex items-center justify-between text-xs animate-fadeIn">
            <div className="flex items-center gap-2">
              <div className="flex items-center gap-1 h-4">
                <span className="w-1 bg-emerald-400 rounded-full animate-bounce h-2"></span>
                <span className="w-1 bg-teal-300 rounded-full animate-bounce h-4 delay-75"></span>
                <span className="w-1 bg-sky-400 rounded-full animate-bounce h-3 delay-150"></span>
                <span className="w-1 bg-teal-400 rounded-full animate-bounce h-5 delay-100"></span>
                <span className="w-1 bg-emerald-300 rounded-full animate-bounce h-2 delay-200"></span>
              </div>
              <span className="font-semibold text-[11px] text-teal-200">
                {isListening
                  ? (voiceStatus || (language === "te" ? "మీ మాటలను వింటున్నాను... చెప్పండి" : "Listening to your voice... Speak now"))
                  : (language === "te" ? "ధన్వి ఏఐ డాక్టర్ మాట్లాడుతున్నారు..." : "AI Doctor Speaking...")}
              </span>
            </div>
            {isSpeaking && (
              <button onClick={() => { DhanviVoice.stop(); setIsSpeaking(false); setActiveVoiceIndex(null); }}
                className="text-[10px] px-2 py-0.5 rounded bg-rose-500/30 text-rose-300 border border-rose-400/40 font-bold hover:bg-rose-500/50">
                ⏹ {language === "te" ? "ఆపండి" : "Stop"}
              </button>
            )}
            {isListening && (
              <button onClick={toggleMic}
                className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/30 text-emerald-300 border border-emerald-400/40 font-bold hover:bg-emerald-500/50">
                ✓ {language === "te" ? "పూర్తయింది" : "Done Speaking"}
              </button>
            )}
          </div>
        )}

        {/* Quick Chips */}
        <div className="px-4 py-2 bg-slate-50 border-t border-slate-200 flex gap-1.5 overflow-x-auto text-[11px]">
          {activeChips.map((c, i) => (
            <button key={i} onClick={() => handleSend(c)}
              className="whitespace-nowrap px-2.5 py-1 rounded-full bg-white border border-slate-200 hover:border-teal-400 hover:text-teal-600 transition shrink-0">
              💡 {c}
            </button>
          ))}
        </div>

        {/* Input Form with Speech-To-Text Mic */}
        <form onSubmit={e => { e.preventDefault(); handleSend(); }} className="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
          <button type="button" onClick={toggleMic}
            className={`p-2.5 rounded-xl text-base transition flex items-center justify-center shrink-0 border ${
              isListening
                ? "bg-rose-600 text-white animate-pulse border-rose-600 shadow-lg shadow-rose-500/40"
                : "bg-slate-100 hover:bg-teal-50 text-teal-700 hover:border-teal-400 border-slate-300"
            }`}
            title={isListening ? "Stop listening" : (language === "te" ? "తెలుగు వాయిస్ మైక్ (వాయిస్ ద్వారా చెప్పండి)" : "Speak your symptoms (AI Voice Input)")}>
            {isListening ? "⏹️" : "🎙️"}
          </button>

          <input type="text" value={input} onChange={e => setInput(e.target.value)}
            placeholder={
              isListening
                ? (language === "te" ? "మీ మాటలను వింటున్నాను..." : "Listening to your voice...")
                : (language === "te" ? "మీ ఆరోగ్య సమస్యను తెలుగులో టైప్ చేయండి లేదా 🎙️ నొక్కి మాట్లాడండి..." : "Type or click 🎙️ to speak your health concern...")
            }
            className="flex-1 text-xs p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500" />

          <button type="submit" disabled={!input.trim() || loading}
            className="px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs transition disabled:opacity-40 shrink-0">
            {language === "te" ? "పంపండి →" : "Send →"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState("home");
  const [theme, setTheme] = useState(() => localStorage.getItem("dhanvi_theme") || "classic");
  const [superOpOpen, setSuperOpOpen] = useState(false);
  const [aiChatOpen, setAiChatOpen] = useState(false);

  // scroll to top on page change
  useEffect(() => { window.scrollTo({ top:0, behavior:'smooth' }); }, [page]);

  // sync theme class to body
  useEffect(() => {
    localStorage.setItem("dhanvi_theme", theme);
    if (theme === "classic") {
      document.body.classList.add("theme-classic");
      document.body.classList.remove("theme-dark");
    } else {
      document.body.classList.add("theme-dark");
      document.body.classList.remove("theme-classic");
    }
  }, [theme]);

  // Listen to open events
  useEffect(() => {
    const openSO = () => setSuperOpOpen(true);
    const openAI = () => setAiChatOpen(true);
    window.addEventListener("open_super_op", openSO);
    window.addEventListener("open_ai_chat", openAI);
    return () => {
      window.removeEventListener("open_super_op", openSO);
      window.removeEventListener("open_ai_chat", openAI);
    };
  }, []);

  const pages = {
    home:       <HomePage setPage={setPage} />,
    features:   <FeaturesPage setPage={setPage} />,
    demo:       <DemoPage />,
    card:       <CardPage />,
    compliance: <CompliancePage />,
    about:      <AboutPage setPage={setPage} />,
  };

  return (
    <div>
      <Navbar activePage={page} setPage={setPage} theme={theme} setTheme={setTheme} />
      <div>{pages[page] || pages.home}</div>
      <Footer setPage={setPage} />

      {/* Floating Quick Action Bar */}
      <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2.5">
        <button onClick={() => setSuperOpOpen(true)}
          className="px-5 py-3 rounded-2xl text-xs font-black text-white bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-600 shadow-2xl shadow-rose-500/30 hover:scale-105 active:scale-95 transition flex items-center gap-2 border border-white/20 animate-bounce">
          <span className="text-base">⚡</span>
          <span>SUPER OP (10-Min Care)</span>
        </button>

        <button onClick={() => { setAiChatOpen(true); setTimeout(() => window.dispatchEvent(new CustomEvent("start_ai_voice")), 300); }}
          className="px-4 py-2.5 rounded-2xl text-xs font-black text-white bg-gradient-to-r from-emerald-500 via-teal-600 to-cyan-700 shadow-xl shadow-teal-500/30 hover:scale-105 active:scale-95 transition flex items-center gap-2 border border-white/20">
          <span className="text-base">🎙️</span>
          <span>తెలుగు AI డాక్టర్ వాయిస్ (TELUGU AI VOICE)</span>
        </button>

        <button onClick={() => setAiChatOpen(true)}
          className="px-4 py-2 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-teal-600 to-sky-700 shadow-lg hover:scale-105 active:scale-95 transition flex items-center gap-2 border border-white/20">
          <span className="text-base">🤖</span>
          <span>Clinical AI Chat</span>
        </button>
      </div>

      <SuperOPModal isOpen={superOpOpen} onClose={() => setSuperOpOpen(false)} />
      <ClinicalAICopilotModal isOpen={aiChatOpen} onClose={() => setAiChatOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
